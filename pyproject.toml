[project]
name = "football-elo"
version = "0.1.0"
description = "Club Elo-style ratings for English football, tiers 1-4, 1955 to now"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
