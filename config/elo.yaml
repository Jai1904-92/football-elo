elo:
  start_date: "1955-08-01"        # first match rated
  burn_in_until: "1965-07-01"     # ratings before this are flagged as burn-in
  scale: 400                      # logistic scale
  # Calibrated 2026-10-19. Country levels start equal in 1955 and are set by
  # European results (pooling + dynamic home advantage); judged on prediction
  # of European and league matches and on bias between the five leagues by
  # decade (2.5pp), with Club Elo as a check (Spearman 0.991, rmse 27).
  # See README, "Early-era calibration".
  k: 15
  hfa: 70                         # home field advantage, Elo points (0 at neutral venues); the
                                  # fixed value, used only when hfa_dynamic is off
  # Dynamic home advantage: each home country's HFA, and one shared HFA for
  # European home games, start at `start` in 1955 and move by eta x (result -
  # expected) after every match with home advantage. Home advantage was far
  # bigger in the 1960s-80s (league ~120, Europe ~160-200) than now (~50/75).
  hfa_dynamic: {eta: 1.0, europe_separate: true, start: 120}
  # League pooling: share of each European rating change that also moves the
  # club's whole country, so league levels follow European results quickly.
  league_pool: 0.3
  # Provisional ratings: a club's first 40 rated matches use K x 2.
  provisional: {matches: 40, k_multiplier: 2.0}
  # K multiplier by competition type
  # Cups at full weight since 2026-10-23: better prediction of league, European and
  # cup results than 0.5 (README "Calibration against Club Elo").
  k_multiplier: {league: 1.0, playoff: 1.0, cup: 1.0, europe: 1.0}
  margin:
    # multiplier on K by absolute goal difference
    #   none:   1
    #   sqrt:   gd ** 0.5 (gd >= 1)
    #   power:  gd ** exponent
    #   table:  explicit values, last value repeated for larger margins
    method: sqrt
    exponent: 0.5
    table: [1.0, 1.0, 1.5, 1.75, 1.875]
  # Result after extra time counts; a penalty shoot-out is a draw.
  # Starting rating when a club is first rated. All five countries start
  # level, with the same tier gap; European results then set their levels.
  # Clubs in a modelled league start at their tier's rating; ratings then carry across tiers on
  # promotion/relegation (no reset). A club that joins a country's lowest
  # modelled tier after that country's first rated season came up from
  # below, so it starts at the rating of the tier below (or `nonleague`).
  newcomer_from_below: true
  countries:
    ENG:
      start_ratings: {1: 1561, 2: 1397, 3: 1233, 4: 1069}
      nonleague: 905
    ESP:
      start_ratings: {1: 1561, 2: 1397}
      nonleague: 1233
    GER:
      start_ratings: {1: 1561, 2: 1397}
      nonleague: 1233
    ITA:
      start_ratings: {1: 1561, 2: 1397}
      nonleague: 1233
    FRA:
      start_ratings: {1: 1561, 2: 1397}
      nonleague: 1233
    POR:                           # tier 1 only; promoted clubs start at the nonleague rating
      start_ratings: {1: 1561}
      nonleague: 1397
    # Added 2026-10-23, tier 1 only like Portugal. Unlike the big seven they don't
    # start level: starting equal left Turkish and Greek clubs (national leagues
    # only from 1959) 25-30pp worse in Europe than predicted in the 1960s.
    # Chosen on European log loss and bias by decade (tools/pool_experiment.py):
    # bias RMS 2.47 -> 2.10pp, log loss unchanged.
    SCO:
      start_ratings: {1: 1436}       # -125
      nonleague: 1272
    BEL:
      start_ratings: {1: 1461}       # -100
      nonleague: 1297
    TUR:
      start_ratings: {1: 1311}       # -250
      nonleague: 1147
    GRE:
      start_ratings: {1: 1311}       # -250
      nonleague: 1147
    NED:
      start_ratings: {1: 1561, 2: 1397}
      nonleague: 1233
  # Hindsight country levels for the season views (src/football_elo/hindsight.py):
  # full correction to 1994/95, fading out by 1999/2000. England's ban seasons
  # (1985/86-1989/90, plus 1990/91 when only Manchester United and Aston Villa were back) step
  # evenly from the pre-ban to the post-ban level.
  hindsight: {window: 3, ridge: 60, full_until: 1994, fade_until: 1999, gaps: {ENG: [1985, 1990]}}
  # Clubs from countries whose leagues are not modelled (met in Europe).
  foreign_start: {default: 1311}
