# Football Elo configuration. Everything tunable lives here, not in code.

paths:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  calibration: data/calibration

sources:
  engsoccerdata:
    url_template: https://raw.githubusercontent.com/jalapic/engsoccerdata/master/data-raw/{name}.csv
    files: [england, facup, leaguecup, englandplayoffs, champs, spain, germany, italy, france, portugal, holland,
            scotland, belgium, turkey, greece]
  football_data:
    url_template: https://www.football-data.co.uk/mmz4281/{season_code}/{division}.csv
    # division -> [country, tier]
    divisions: {E0: [ENG, 1], E1: [ENG, 2], E2: [ENG, 3], E3: [ENG, 4],
                SP1: [ESP, 1], SP2: [ESP, 2], D1: [GER, 1], D2: [GER, 2],
                I1: [ITA, 1], I2: [ITA, 2], F1: [FRA, 1], F2: [FRA, 2],
                P1: [POR, 1], N1: [NED, 1], SC0: [SCO, 1], B1: [BEL, 1], T1: [TUR, 1], G1: [GRE, 1]}
    first_season: 1993             # earlier seasons not needed (engsoccerdata covers them)
  transfermarkt:
    # dcaribou/transfermarkt-datasets; 2012/13 to July 2026 (collection stopped then)
    url_template: https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/{name}.csv.gz
    files: [games, clubs, competitions]
    competitions: {CL: UCL, CLQ: UCL, EL: UEL, ELQ: UEL, UCOL: UECL, ECLQ: UECL, USC: USC,
                   FAC: ENG-FAC, CGB: ENG-LC,
                   CDR: ESP-CDR, DFB: GER-DFB, CIT: ITA-CI, NLP: NED-KNVB, POCP: POR-TP}
    # top flights, used only to match club ids to names (tools/derive_aliases.py)
    match_only: {GB1: ENG-L, ES1: ESP-L, L1: GER-L, IT1: ITA-L, FR1: FRA-L, PO1: POR-L, NL1: NED-L,
                 SC1: SCO-L, BE1: BEL-L, TR1: TUR-L, GR1: GRE-L}
  datarozhlas:
    # Wikipedia-scraped European club results (github.com/DataRozhlas/evropske-pohary).
    # Known gaps: Fairs Cup 1963-66, Cup Winners' Cup 1980/81 first round.
    url: https://raw.githubusercontent.com/DataRozhlas/evropske-pohary/master/data/matches.csv
    competitions: {UCL: UCL, EL: UEL, CWC: UCWC, ICFC: FAIRS, UECL: UECL}
  rsssf:
    # RSSSF season pages (free to copy with acknowledgement), saved as
    # <start year>.html. URL fields: {season} start year, {end2} end year's last
    # two digits, {end} the same before 2010 and four digits after.
    # `tiers` maps a tier to the headings of its section (grids.sections), or
    # null when the whole page is that tier's results grid. Tier-1 sections
    # where engsoccerdata already has the season are read only to link club
    # names (tools/link_grid_names.py). Dates: printed where the page has them,
    # else one round a week, else a synthetic round-robin (sources._schedule).
    leagues:
      POR-L:
        # Portuguese top flight before engsoccerdata starts (1955/56-1993/94).
        # Credit: Jorge Miguel Teixeira.
        folder: portugal
        url_template: https://www.rsssf.org/tablesp/porthist{season}{end2}.html
        seasons: [1955, 1993]
        tiers: {1: null}
      ITA-L:
        # Serie B before football-data starts (1955/56-1996/97): grids, and
        # round order (some dates) from 1961/62. Credit: Maurizio Mariani
        # (Serie B stage results thanks to Sorin Arotaritei).
        folder: italy
        url_template: https://www.rsssf.org/tablesi/ital{end}.html
        seasons: [1955, 1996]
        # football-data holds only part of these Serie B seasons
        extra_pages: {2002: https://www.rsssf.org/tablesi/ital03.html,
                      2004: https://www.rsssf.org/tablesi/ital2-05.html}
        tiers:
          1: {start: 'Italy Championship \d{4}/\d{2}|SERIE A|.*\(Serie A\)',
              end: 'SERIE B( \d{4}/\d{2})?|.*\(Serie B\)|Coppa Italia.*'}
          2: {start: 'SERIE B( \d{4}/\d{2})?|.*\(Serie B\)',
              end: 'SERIE C.*|.*\(Serie C.*|Promotion Playoff'}   # bare heading: 2004/05 page
      FRA-L:
        # Ligue 2 2003/04 (dated round lists), which football-data holds only 15
        # matches of. RSSSF's 2002/03 page has no Ligue 2: see wikipedia.
        folder: france
        url_template: https://www.rsssf.org/tablesf/fran{end}.html
        seasons: [2003, 2003]
        tiers:
          2: {start: 'Second Level( \d{4}/\d{2})?', end: 'Third Level.*'}
      NED-L:
        # Eerste Divisie 1956/57-2024/25 (groups A/B to 1961/62): grids to
        # 2003/04, dated round lists from 2004/05. The 2025/26 page has the
        # final table only so far. Credit: Karel Stokkermans and the RSSSF
        # Netherlands contributors.
        folder: netherlands
        url_template: https://www.rsssf.org/tablesn/ned{end}.html
        seasons: [1956, 2024]
        tiers:
          1: {start: '(First Level \()?Eredivisie\)?\s*(\d{4}[-/]\d{2,4})?',
              end: '(Second Level \()?Eerste divisie.*|KNVB Beker|Cup \d{4}.*|Nacompetitie|Europa League Playoff'}
          2: {start: '(Second Level \()?Eerste divisie\)?( [A-Z])?\s*(\d{4}[-/]\d{2,4})?',
              end: 'Tweede divisie.*|Third Level.*|Nacompetitie.*|Amateur.*|list of champions.*|Promotion.*|Beslissing.*|Play-?offs?.*'}
  rsssf_finals:
    # National championship final rounds, one RSSSF history page per country.
    GER-CH:
      # Germany 1955/56-1962/63, before the Bundesliga: the regional Oberliga
      # champions' qualifiers, groups and final (Oberliga matches themselves have
      # no free match-level source). Credit: Pierre Winkler.
      folder: germany
      file: duithist4763.html
      url: https://www.rsssf.org/tablesd/duithist4763.html
      seasons: [1955, 1962]
  wikipedia:
    # Raw wikitext of English Wikipedia season articles, saved as <start
    # year>.txt; every {{Sports results}} grid on the page is read. Results are
    # cited to BDFutbol. Clubs are keyed by the article they link to.
    url: https://en.wikipedia.org/w/index.php
    # {endw} is the end year as article titles write it (2 digits, 4 at a century).
    leagues:
      ESP-L:
        # Segunda División: the league before football-data starts (1955/56-
        # 1995/96, with the regional groups to 1967/68 and 1986/87's second
        # phase), then to 2007/08 to fill football-data's partial seasons and to
        # link club names. La Liga pages only link club names.
        - {folder: spain, title_template: "{season}–{endw} Segunda División", seasons: [1955, 2007], tier: 2}
        - {folder: spain-1, title_template: "{season}–{endw} La Liga", seasons: [1955, 2007], tier: 1}
      # Top flights of Scotland, Belgium, Turkey and Greece before engsoccerdata
      # starts (1994/95): one grid per season, synthetic dates. Seasons after
      # 1993/94 overlap engsoccerdata and are read only to link club names.
      SCO-L:
        - {folder: scotland, title_template: "{season}–{endw} Scottish Division One", seasons: [1955, 1974], tier: 1}
        - {folder: scotland, title_template: "{season}–{endw} Scottish Premier Division", seasons: [1975, 1997], tier: 1}
      BEL-L:
        - {folder: belgium, title_template: "{season}–{endw} Belgian First Division", seasons: [1955, 2004], tier: 1}
      TUR-L:
        # a national league only from spring 1959
        - {folder: turkey, title_template: "1959 Milli Lig", seasons: [1958, 1958], tier: 1}
        - {folder: turkey, title_template: "{season}–{endw} Milli Lig", seasons: [1959, 1962], tier: 1}
        - {folder: turkey, title_template: "{season}–{endw} 1.Lig", seasons: [1963, 2000], tier: 1}
      GRE-L:
        # 1955/56-1958/59: the national final round of the regional champions
        - {folder: greece, title_template: "{season}–{endw} Panhellenic Championship", seasons: [1955, 1958], tier: 1}
        - {folder: greece, title_template: "{season}–{endw} Alpha Ethniki", seasons: [1959, 2004], tier: 1}
      FRA-L:
        # Ligue 2 2002/03, which football-data holds only part of (no dates: the
        # grid gets a synthetic schedule). 2003/04 links names; RSSSF has its dates.
        - {folder: france, title_template: "{season}–{endw} Ligue 2", seasons: [2002, 2003], tier: 2}
    # Domestic cup season articles, 1955/56 on; titles and gaps from a probe of
    # the Wikipedia API on 2026-10-23 (missing seasons have no article). Runs to
    # 2014/15 overlap Transfermarkt for name linking; Scotland, Belgium, Turkey
    # and Greece have no other cup source, so theirs run to the present. Read by
    # sources.wikipedia_cup (layouts in wikicups.py); transcluded finals are cached
    # in <folder>/transcluded. Not in any competition's windows yet: club names
    # need linking first. Coverage: tools/cup_coverage.py.
    # {endyear} is the four-digit end year (spring-only cups).
    cups:
      ESP-CDR:
        - {folder: cup-spain, title_template: "{endyear} Copa del Generalísimo", seasons: [1955, 1957]}
        - {folder: cup-spain, title_template: "{season}–{endw} Copa del Generalísimo", seasons: [1958, 1967]}
        - {folder: cup-spain, title_template: "{endyear} Copa del Generalísimo", seasons: [1968, 1968]}
        - {folder: cup-spain, title_template: "{season}–{endw} Copa del Generalísimo", seasons: [1969, 1975]}
        - {folder: cup-spain, title_template: "{season}–{endw} Copa del Rey", seasons: [1976, 2014]}
      GER-DFB:
        - {folder: cup-germany, title_template: "{season}–{endw} DFB-Pokal", seasons: [1955, 2014]}
      ITA-CI:
        - {folder: cup-italy, title_template: "{endyear} Coppa Italia", seasons: [1957, 1957]}
        - {folder: cup-italy, title_template: "{season}–{endw} Coppa Italia", seasons: [1958, 2014]}
      FRA-CDF:
        - {folder: cup-france, title_template: "{season}–{endw} Coupe de France", seasons: [1957, 2014]}
      NED-KNVB:
        - {folder: cup-netherlands, title_template: "{season}–{endw} KNVB Cup", seasons: [1969, 2014]}
      POR-TP:
        - {folder: cup-portugal, title_template: "{season}–{endw} Taça de Portugal", seasons: [1962, 1968]}
        - {folder: cup-portugal, title_template: "{season}–{endw} Taça de Portugal", seasons: [1982, 1982]}
        - {folder: cup-portugal, title_template: "{season}–{endw} Taça de Portugal", seasons: [1990, 2014]}
      SCO-SC:
        - {folder: cup-scotland, title_template: "{season}–{endw} Scottish Cup", seasons: [1955, 2025]}
      BEL-BC:
        - {folder: cup-belgium, title_template: "{season}–{endw} Belgian Cup", seasons: [1978, 1978]}
        - {folder: cup-belgium, title_template: "{season}–{endw} Belgian Cup", seasons: [1989, 2025]}
      TUR-TC:
        - {folder: cup-turkey, title_template: "{season}–{endw} Turkish Cup", seasons: [1965, 1965]}
        - {folder: cup-turkey, title_template: "{season}–{endw} Turkish Cup", seasons: [1974, 1974]}
        - {folder: cup-turkey, title_template: "{season}–{endw} Turkish Cup", seasons: [1987, 2025]}
      GRE-GC:
        - {folder: cup-greece, title_template: "{season}–{endw} Greek Football Cup", seasons: [1955, 2025]}
  espn:
    # Unofficial public scoreboard API, one request per league per calendar year.
    url_template: https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard
    first_year: 2016
    # slug -> competition. League slugs are read for their play-off matches only.
    # Since 2020 UEFA qualifiers sit under separate *_qual slugs.
    slugs: {uefa.champions: UCL, uefa.champions_qual: UCL, uefa.europa: UEL, uefa.europa_qual: UEL,
            uefa.europa.conf: UECL, uefa.europa.conf_qual: UECL, uefa.super_cup: USC,
            eng.fa: ENG-FAC, eng.league_cup: ENG-LC, eng.2: ENG-PO, eng.3: ENG-PO, eng.4: ENG-PO,
            esp.copa_del_rey: ESP-CDR, ger.dfb_pokal: GER-DFB, ita.coppa_italia: ITA-CI,
            fra.coupe_de_france: FRA-CDF, ned.cup: NED-KNVB, por.taca.portugal: POR-TP}

# Competitions and where their results come from. Windows are in priority
# order: each source contributes rows inside its date window, but only for
# (season, tier) blocks that no earlier source already covers, except that a
# window with `replace_partial: x` takes over blocks where the earlier sources
# have under x times its own match count (a season they hold only part of).
# `tiers` limits a window to those tiers (sources whose tier-1 sections are
# read only to link club names). So gaps in an
# earlier source (e.g. engsoccerdata has no 2022/23 league season) are filled
# by a later one, and overlaps never double count.
competitions:
  ENG-L:
    name: English Football League (tiers 1-4)
    type: league
    country: ENG
    engsoccerdata: {file: england, max_tier: 4}
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
  ESP-L:
    name: La Liga / Segunda (tiers 1-2)
    type: league
    country: ESP
    engsoccerdata: {file: spain, max_tier: 2}     # tier 1 only
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}                     # tier 2 from 1996/97
      # tier 2 1955/56-1995/96, and football-data's partial seasons (2001-03, 2007)
      - {source: wikipedia, tiers: [2], replace_partial: 0.9}
  GER-L:
    name: Bundesliga / 2. Bundesliga (tiers 1-2)
    type: league
    country: GER
    engsoccerdata: {file: germany, max_tier: 2}   # from 1963 (tier 2 from 1974)
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
  ITA-L:
    name: Serie A / Serie B (tiers 1-2)
    type: league
    country: ITA
    engsoccerdata: {file: italy, max_tier: 2}     # tier 1 only
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: rsssf, tiers: [2]}                 # tier 2 1955/56-1996/97, 2002/03, 2004/05
      - {source: football_data}                     # tier 2 from 1997/98
  FRA-L:
    name: Ligue 1 / Ligue 2 (tiers 1-2)
    type: league
    country: FRA
    engsoccerdata: {file: france, max_tier: 2}    # tier 1 only (1993/94 missing); tier 2 from football-data
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
      # football-data's partial Ligue 2 seasons: 2003/04 (dated), then 2002/03
      - {source: rsssf, tiers: [2], replace_partial: 0.9}
      - {source: wikipedia, tiers: [2], replace_partial: 0.9}
  POR-L:
    name: Primeira Liga (tier 1)
    type: league
    country: POR
    engsoccerdata: {file: portugal, max_tier: 1}  # from 1994/95 only
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: rsssf}                             # 1955/56-1993/94, synthetic dates
      - {source: football_data}
  SCO-L:
    name: Scottish top flight (tier 1)
    type: league
    country: SCO
    engsoccerdata: {file: scotland, max_tier: 1}  # from 1994/95
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
      - {source: wikipedia}                         # 1955/56-1993/94, synthetic dates
  BEL-L:
    name: Belgian top flight (tier 1)
    type: league
    country: BEL
    engsoccerdata: {file: belgium, max_tier: 1}   # from 1995/96
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
      - {source: wikipedia}
  TUR-L:
    name: Turkish top flight (tier 1)
    type: league
    country: TUR
    engsoccerdata: {file: turkey, max_tier: 1}    # from 1994/95
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
      - {source: wikipedia}
  GRE-L:
    name: Greek top flight (tier 1)
    type: league
    country: GRE
    engsoccerdata: {file: greece, max_tier: 1}    # from 1994/95
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: football_data}
      - {source: wikipedia}
  NED-L:
    name: Eredivisie / Eerste Divisie (tiers 1-2)
    type: league
    country: NED
    engsoccerdata: {file: holland, max_tier: 1}   # from 1956/57
    windows:
      - {source: engsoccerdata, until: "2025-06-30"}
      - {source: rsssf, tiers: [2]}                 # tier 2 1956/57-2024/25
      - {source: football_data}
  GER-CH:
    name: German championship final round (to 1963)
    type: playoff
    country: GER
    start_tier: 1                   # Oberliga sides: a club first seen here starts at top-flight level
    windows:
      - {source: rsssf_finals}
  ENG-PO:
    name: EFL play-offs
    type: playoff
    country: ENG
    windows:
      - {source: engsoccerdata}
      - {source: espn}
  ENG-FAC:
    name: FA Cup
    type: cup
    country: ENG
    windows:
      - {source: engsoccerdata}
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn}
  ENG-LC:
    name: League Cup
    type: cup
    country: ENG
    windows:
      - {source: engsoccerdata}
      - {source: espn}                # complete from 2019/20; Transfermarkt only from 2023
      - {source: transfermarkt, until: "2026-06-30"}
  # Domestic cups outside England: Transfermarkt from 2012/13 to 2025/26, ESPN
  # after that and for Transfermarkt's partial seasons. Clubs with no known
  # country take the cup's (silver.build), so amateur sides start at the
  # country's non-league rating.
  ESP-CDR:
    name: Copa del Rey
    type: cup
    country: ESP
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn, replace_partial: 0.9}
  GER-DFB:
    name: DFB-Pokal
    type: cup
    country: GER
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn, replace_partial: 0.9}
  ITA-CI:
    name: Coppa Italia
    type: cup
    country: ITA
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn, replace_partial: 0.9}
  FRA-CDF:
    name: Coupe de France
    type: cup
    country: FRA
    windows:
      - {source: espn}                # last 64 onwards, from 2015/16; not in Transfermarkt
  NED-KNVB:
    name: KNVB Cup
    type: cup
    country: NED
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn, replace_partial: 0.9}
  POR-TP:
    name: Taça de Portugal
    type: cup
    country: POR
    windows:
      - {source: transfermarkt, until: "2026-06-30"}   # some seasons from the last 8 only
      - {source: espn, replace_partial: 0.9}            # from 2021/22
  UCL:
    name: European Cup / Champions League (incl. qualifying)
    type: europe
    windows:
      - {source: engsoccerdata, until: "2016-06-30"}   # its 2016/17 and 2017/18 hold only the finals
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn}
  UEL:
    name: UEFA Cup / Europa League (incl. qualifying)
    type: europe
    windows:
      - {source: datarozhlas, until: "2012-06-30"}
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn}
  UECL:
    name: Conference League (incl. qualifying)
    type: europe
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn}
  UCWC:
    name: Cup Winners' Cup
    type: europe
    windows:
      - {source: datarozhlas}
  FAIRS:
    name: Inter-Cities Fairs Cup
    type: europe
    windows:
      - {source: datarozhlas}
  USC:
    name: UEFA Super Cup
    type: europe
    windows:
      - {source: transfermarkt, until: "2026-06-30"}
      - {source: espn}

aliases: config/club_aliases.csv

# A club's country is normally the one it most often played in; these are fixed
# because their league games were abroad (Cypriot champions entered the Greek
# league 1967/68-1973/74), so their European results count for their own country.
club_countries: {Omonia Nicosia: CYP, APOEL Nikosia: CYP, AEL Limassol: CYP, EPA Larnaca: CYP, Olympiakos Nicosia: CYP}

# Source errors that a plain alias can't fix (they only apply to some seasons).
# Applied to the source's own club keys before aliasing.
corrections:
  # engsoccerdata labels Gazelec Ajaccio's 2015/16 Ligue 1 season as AC Ajaccio
  # (AC Ajaccio were in Ligue 2 that season)
  - {source: engsoccerdata, competition: FRA-L, season: 2015, club: AC Ajaccio, to: GFC Ajaccio}
  # engsoccerdata's 1956/57-1957/58 Eredivisie "DWS Amsterdam" is BVC Amsterdam,
  # which merged with DWS in 1958; the DWS of those seasons was in the Eerste Divisie
  - {source: rsssf, competition: NED-L, season: 1956, club: D.W.S., to: D.W.S. (1907)}
  - {source: rsssf, competition: NED-L, season: 1957, club: D.W.S., to: D.W.S. (1907)}
  # RSSSF's "Messina" is A.C.R. Messina up to the 1990s; the 2002/03 Serie B club
  # is the refounded FC Messina (as football-data has it)
  - {source: rsssf, competition: ITA-L, season: 2002, club: Messina, to: FC Messina}
  # engsoccerdata's "Waregem" is KSV Waregem (to 2001) in 1995/96 but SV Zulte Waregem
  # (founded 2001) from 2005/06
  - {source: engsoccerdata, competition: BEL-L, season: 2005, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2006, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2007, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2008, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2009, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2010, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2011, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2012, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2013, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2014, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2015, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2016, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2017, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2018, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2019, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2020, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2021, club: Waregem, to: Zulte-Waregem}
  - {source: engsoccerdata, competition: BEL-L, season: 2022, club: Waregem, to: Zulte-Waregem}
